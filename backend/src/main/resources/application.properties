spring.application.name=backend

# Render provides PORT in production; use 8080 for local development.
server.port=${PORT:8080}

# Frontend origin allowed to send the session cookie.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# For a separately hosted HTTPS frontend/backend, set both to none/true.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# MySQL database (started with docker compose up -d)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/nutriflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nutriflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nutriflow}

# Create/update tables from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Password reset email configuration (set these in Render, never commit them).
app.mail.from=${MAIL_FROM:}
app.resend.api-key=${RESEND_API_KEY:}
app.password-reset-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.google-client-id=${GOOGLE_CLIENT_ID:}
