services:
  - type: web
    name: nutriflow-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        sync: false
      - key: PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS
        sync: false
      - key: RATE_LIMIT_WINDOW_SECONDS
        sync: false

  - type: web
    name: nutriflow-vision-api
    runtime: docker
    rootDir: backend/src/main/python
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
